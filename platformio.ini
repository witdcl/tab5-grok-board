; M5Stack Tab5 PlatformIO 骨架
; 板型与平台标签来自官方文档，不要改平台 commit：
; https://docs.m5stack.com/zh_CN/core/Tab5
;
; 屏幕驱动有 ST7123 / ST7121，早期批次是 ILI9881C + GT911。
; 官方要求 M5Unified >= 0.2.23、M5GFX >= 0.2.30。
; 下面的 git 地址与官方片段一致，跟踪仓库默认分支，不锁 tag。
; 若默认分支低于上述版本，请改到满足下限的 tag 后再编译。
;
; 键盘库已核对：
; https://github.com/m5stack/M5Unit-KEYBOARD
; PlatformIO registry 名称同为 m5stack/M5Unit-KEYBOARD。
; 0.1.0 起提供 UnitTab5Keyboard，library.json 依赖 M5UnitUnified >= 0.4.6。
;
; macOS 串口会随插拔变化。下面只是示例，默认不写死：
;   upload_port = /dev/cu.usbmodem101
;   monitor_port = /dev/cu.usbmodem101
; 列出当前端口：pio device list

[platformio]
default_envs = esp32p4_pioarduino

[env:esp32p4_pioarduino]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
upload_speed = 1500000
monitor_speed = 115200
build_type = debug
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
; Tab5 是 16MB Flash。esp32-p4-evboard.json 写了 default_16MB.csv，
; 但 54.03.21 不会自动套用 arduino.partitions，不写这一行时 app 槽只有 1.25MB，
; 中文字库放不进去。
board_build.partitions = default_16MB.csv
; 键盘库头文件分散在依赖里，deep 与上游 M5Unit-KEYBOARD 的 platformio.ini 一致。
lib_ldf_mode = deep

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; 默认状态板：排除荐书入口，避免双 setup/loop。
build_src_filter =
    +<*>
    -<main_weread.cpp>

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
    https://github.com/m5stack/M5Unit-KEYBOARD.git
    bblanchon/ArduinoJson@^7.2.1

; upload_port = /dev/cu.usbmodem101
; monitor_port = /dev/cu.usbmodem101

; 微信读书三屏荐书板
[env:tab5_weread]
extends = env:esp32p4_pioarduino
build_src_filter =
    +<*>
    -<main.cpp>
    -<ui.cpp>
    -<status_client.cpp>
