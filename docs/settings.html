<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · TAB5 荐书板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font: "Noto Sans SC", "PingFang SC", sans-serif;
      --bg: #070605;
      --paper: #efe4d0;
      --brass: #c4a15a;
      --muted: #9a9082;
      --line: #3a342c;
      --ink: #1c1814;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 45% at 50% -8%, #2e261c 0%, transparent 55%),
        var(--bg);
      color: var(--paper);
      font-family: var(--font);
      padding: 28px 18px 64px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    a { color: var(--brass); text-decoration: none; }
    a:hover { color: #e0c888; }
    h1 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.4em;
      color: var(--muted);
    }
    .sub {
      color: #6e6558;
      font-size: 13px;
      line-height: 1.7;
      margin: 0 0 28px;
    }
    section {
      border: 1px solid var(--line);
      padding: 22px 22px 18px;
      margin-bottom: 18px;
      background: rgba(28, 24, 20, 0.55);
    }
    h2 {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--brass);
    }
    label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 12px 0 6px;
    }
    input, textarea {
      width: 100%;
      background: #100e0c;
      border: 1px solid var(--line);
      color: var(--paper);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 2px;
    }
    textarea { min-height: 72px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button {
      appearance: none;
      border: 1px solid var(--brass);
      background: transparent;
      color: var(--brass);
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.18em;
      padding: 11px 16px;
      cursor: pointer;
    }
    button.primary { background: var(--brass); color: #1a140c; font-weight: 700; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .hint {
      margin: 10px 0 0;
      font-size: 12px;
      line-height: 1.7;
      color: #6e6558;
    }
    .msg {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.6;
      min-height: 1.4em;
    }
    .msg.ok { color: #8fbf7a; }
    .msg.err { color: #c47a5a; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
      color: #d2c4a8;
    }
    .lane-list {
      display: grid;
      gap: 8px;
    }
    .lane-list label.lane {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      background: #100e0c;
      color: var(--paper);
      letter-spacing: 0;
      font-size: 13px;
      line-height: 1.45;
      cursor: pointer;
    }
    .lane-list label.lane input { margin-top: 3px; width: auto; }
    .lane-list .lane small { display: block; color: #6e6558; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>设置</h1>
    <p class="sub">
      <a href="./">← 返回预览</a>
      · 先勾想读的类型，保存后再生成；Tab5 会跟着更新。
    </p>

    <section>
      <h2>想读哪些类型</h2>
      <p class="hint" style="margin-top:0">
        勾选少于每天本数时，类型可能重复凑满；勾选达到或超过本数时，每类最多出一本。
      </p>
      <div id="lane-list" class="lane-list"></div>
      <div class="row" style="margin-top:14px">
        <div>
          <label for="playlist_size">每天几本</label>
          <input id="playlist_size" type="number" min="1" max="5" step="1" />
        </div>
        <div>
          <label for="daily_hour">几点自动更新（北京时间）</label>
          <input id="daily_hour" type="number" min="0" max="23" step="1" />
        </div>
      </div>
      <label for="note">给自己的备注</label>
      <textarea id="note" placeholder="可选"></textarea>
      <div class="actions">
        <button type="button" class="primary" id="btn-save">保存设置</button>
        <button type="button" id="btn-reload">重新加载</button>
      </div>
      <p class="hint">保存要用下面的访问令牌；没有令牌也可以在仓库里直接改设置文件。</p>
      <div class="msg" id="settings-msg"></div>
    </section>

    <section>
      <h2>马上换一批</h2>
      <p class="hint" style="margin-top:0">
        按当前勾选重新找书、写文案并推到主页。一般要几分钟。
      </p>
      <div class="actions">
        <button type="button" class="primary" id="btn-run">马上换一批</button>
        <a id="actions-link" href="#" target="_blank" rel="noopener">查看进度</a>
      </div>
      <div class="msg" id="run-msg"></div>
    </section>

    <section>
      <h2>访问令牌（只记在这台电脑）</h2>
      <label for="repo">仓库名</label>
      <input id="repo" type="text" placeholder="你的账号/tab5-grok-board" autocomplete="off" />
      <label for="token">GitHub 令牌</label>
      <input id="token" type="password" placeholder="粘贴后点记住" autocomplete="off" />
      <div class="actions">
        <button type="button" id="btn-token-save">记住</button>
        <button type="button" id="btn-token-clear">清除</button>
      </div>
      <p class="hint">令牌只存在本机浏览器，不会上传到网页。公用电脑不要填。</p>
      <div class="msg" id="token-msg"></div>
    </section>

    <section>
      <h2>设备拉取地址</h2>
      <p class="hint" style="margin-top:0">Tab5 读的就是这个地址：</p>
      <p><code id="device-url">./weread_day.json</code></p>
    </section>
  </div>

  <script>
    const LS_TOKEN = "tab5_weread_gh_token";
    const LS_REPO = "tab5_weread_gh_repo";
    const LANES = [
      { id: "fiction_cn", label: "中文小说", hint: "现当代或经典长篇" },
      { id: "fiction_world", label: "翻译小说", hint: "外国文学译本" },
      { id: "essay", label: "随笔思想", hint: "随笔、评论、思想类" },
      { id: "science", label: "科学社会", hint: "科学、社会、艺术、自然" },
      { id: "history", label: "史传纪实", hint: "通史、传记、纪实" },
    ];
    let siteConfig = { repo: "", workflow: "daily.yml" };

    function $(id) { return document.getElementById(id); }
    function setMsg(id, text, ok) {
      const el = $(id);
      el.textContent = text || "";
      el.className = "msg " + (ok === true ? "ok" : ok === false ? "err" : "");
    }
    function currentRepo() {
      return ($("repo").value || siteConfig.repo || "").trim();
    }
    function pagesDayUrl() {
      const repo = currentRepo();
      if (!repo.includes("/")) return new URL("./weread_day.json", location.href).href;
      const [owner, name] = repo.split("/");
      return `https://${owner}.github.io/${name}/weread_day.json`;
    }
    function refreshDeviceUrl() {
      $("device-url").textContent = pagesDayUrl();
      const repo = currentRepo();
      $("actions-link").href = repo
        ? `https://github.com/${repo}/actions/workflows/${siteConfig.workflow || "daily.yml"}`
        : "#";
    }
    function renderLanes(selected) {
      const box = $("lane-list");
      const set = new Set(selected && selected.length ? selected : LANES.map((l) => l.id));
      box.innerHTML = "";
      LANES.forEach((lane) => {
        const lab = document.createElement("label");
        lab.className = "lane";
        lab.innerHTML = `<input type="checkbox" value="${lane.id}" ${set.has(lane.id) ? "checked" : ""} />
          <span>${lane.label}<small>${lane.hint}</small></span>`;
        box.appendChild(lab);
      });
    }
    function selectedLanes() {
      return [...document.querySelectorAll("#lane-list input:checked")].map((el) => el.value);
    }
    function fillSettings(s) {
      $("playlist_size").value = s.playlist_size ?? 5;
      $("daily_hour").value = s.daily_hour ?? 7;
      $("note").value = s.note || "";
      renderLanes(s.lanes);
    }
    function readSettingsForm() {
      const lanes = selectedLanes();
      return {
        playlist_size: Number($("playlist_size").value) || 5,
        daily_hour: Number($("daily_hour").value) || 7,
        timezone: "Asia/Shanghai",
        lanes: lanes.length ? lanes : LANES.map((l) => l.id),
        note: $("note").value || "",
      };
    }
    async function loadAll() {
      try {
        const [sRes, cRes] = await Promise.all([
          fetch(`./settings.json?t=${Date.now()}`, { cache: "no-store" }),
          fetch(`./site-config.json?t=${Date.now()}`, { cache: "no-store" }),
        ]);
        if (sRes.ok) fillSettings(await sRes.json());
        if (cRes.ok) siteConfig = await cRes.json();
      } catch (_) { /* ignore */ }
      $("token").value = localStorage.getItem(LS_TOKEN) || "";
      $("repo").value = localStorage.getItem(LS_REPO) || siteConfig.repo || "";
      refreshDeviceUrl();
    }
    async function gh(path, method, body) {
      const token = $("token").value.trim();
      const repo = currentRepo();
      if (!token || !repo) throw new Error("请先填写仓库与 Token");
      const res = await fetch(`https://api.github.com/repos/${repo}${path}`, {
        method,
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json",
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { message: text }; }
      if (!res.ok) throw new Error((data && data.message) || `HTTP ${res.status}`);
      return data;
    }
    async function putFile(path, contentObj, message) {
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(contentObj, null, 2) + "\n")));
      let sha;
      try {
        const cur = await gh(`/contents/${path}`, "GET");
        sha = cur.sha;
      } catch (_) { /* new file */ }
      return gh(`/contents/${path}`, "PUT", { message, content, sha, branch: "main" });
    }

    $("btn-reload").addEventListener("click", () => loadAll());
    $("btn-token-save").addEventListener("click", () => {
      localStorage.setItem(LS_TOKEN, $("token").value.trim());
      localStorage.setItem(LS_REPO, $("repo").value.trim());
      refreshDeviceUrl();
      setMsg("token-msg", "已记住。", true);
    });
    $("btn-token-clear").addEventListener("click", () => {
      localStorage.removeItem(LS_TOKEN);
      localStorage.removeItem(LS_REPO);
      $("token").value = "";
      setMsg("token-msg", "已清除。", true);
    });
    $("repo").addEventListener("input", refreshDeviceUrl);
    $("btn-save").addEventListener("click", async () => {
      setMsg("settings-msg", "保存中…");
      try {
        const settings = readSettingsForm();
        await putFile("docs/settings.json", settings, "chore: update weread settings");
        setMsg("settings-msg", "设置已保存。", true);
      } catch (e) {
        setMsg("settings-msg", String(e.message || e), false);
      }
    });
    $("btn-run").addEventListener("click", async () => {
      setMsg("run-msg", "触发中…");
      try {
        const wf = siteConfig.workflow || "daily.yml";
        await gh(`/actions/workflows/${wf}/dispatches`, "POST", {
          ref: "main",
          inputs: { reason: "settings-page" },
        });
        setMsg("run-msg", "已开始换一批，过几分钟刷新预览看看。", true);
      } catch (e) {
        setMsg("run-msg", String(e.message || e), false);
      }
    });

    loadAll();
  </script>
</body>
</html>
