<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · TAB5 荐书板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font: "Noto Sans SC", "PingFang SC", sans-serif;
      --bg: #070605;
      --paper: #efe4d0;
      --brass: #c4a15a;
      --muted: #9a9082;
      --line: #3a342c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 45% at 50% -8%, #2e261c 0%, transparent 55%),
        var(--bg);
      color: var(--paper);
      font-family: var(--font);
      padding: 28px 18px 64px;
    }
    .wrap { max-width: 920px; margin: 0 auto; }
    a { color: var(--brass); text-decoration: none; }
    a:hover { color: #e0c888; }
    h1 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.4em;
      color: var(--muted);
    }
    .sub {
      color: #6e6558;
      font-size: 13px;
      line-height: 1.7;
      margin: 0 0 28px;
    }
    section {
      border: 1px solid var(--line);
      padding: 22px 22px 18px;
      margin-bottom: 18px;
      background: rgba(28, 24, 20, 0.55);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--brass);
    }
    label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 12px 0 6px;
    }
    input, textarea {
      width: 100%;
      background: #100e0c;
      border: 1px solid var(--line);
      color: var(--paper);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 2px;
    }
    textarea { min-height: 64px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) {
      .row, .boards { grid-template-columns: 1fr !important; }
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button {
      appearance: none;
      border: 1px solid var(--brass);
      background: transparent;
      color: var(--brass);
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.18em;
      padding: 11px 16px;
      cursor: pointer;
    }
    button.primary { background: var(--brass); color: #1a140c; font-weight: 700; }
    .hint {
      margin: 0 0 14px;
      font-size: 12px;
      line-height: 1.7;
      color: #6e6558;
    }
    .msg {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.6;
      min-height: 1.4em;
    }
    .msg.ok { color: #8fbf7a; }
    .msg.err { color: #c47a5a; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.92em;
      color: #d2c4a8;
    }
    .boards {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 14px;
      align-items: start;
    }
    .board {
      border: 1px solid var(--line);
      background: #100e0c;
      min-height: 280px;
      padding: 10px;
    }
    .board h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: var(--muted);
    }
    .board.drop-hover { border-color: var(--brass); }
    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      margin-bottom: 6px;
      border: 1px solid #2a2620;
      background: #161310;
      cursor: grab;
      user-select: none;
    }
    .chip:active { cursor: grabbing; }
    .chip.dragging { opacity: 0.45; }
    .chip .handle {
      color: #5a5348;
      letter-spacing: 0;
      font-size: 14px;
      line-height: 1;
    }
    .chip .meta { flex: 1; min-width: 0; }
    .chip .name { font-size: 13px; color: var(--paper); }
    .chip .desc {
      font-size: 11px;
      color: #6e6558;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip .rank {
      font-size: 11px;
      color: var(--brass);
      letter-spacing: 0.08em;
      min-width: 1.6em;
      text-align: right;
    }
    #ban-list .chip .rank { display: none; }
    .empty {
      color: #5a5348;
      font-size: 12px;
      padding: 18px 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>设置</h1>
    <p class="sub">
      <a href="./">← 返回预览</a>
      · 类型对齐微信读书常见类目。左边是选书，右边是黑名单。
    </p>

    <section>
      <h2>选书类型与黑名单</h2>
      <p class="hint">
        左边可拖拽排序：越靠前略优先，最后仍可能被选中。<br />
        拖到右边加入黑名单（一定不会出现）；再拖回左边即可恢复。<br />
        勾选少于每天本数时类型可重复；达到或超过本数时每类最多一本。
      </p>
      <div class="boards">
        <div class="board" id="pick-board" data-list="pick">
          <h3>选书类型（可排序）</h3>
          <div id="pick-list"></div>
        </div>
        <div class="board" id="ban-board" data-list="ban">
          <h3>黑名单</h3>
          <div id="ban-list"></div>
        </div>
      </div>
      <div class="row" style="margin-top:14px">
        <div>
          <label for="playlist_size">每天几本</label>
          <input id="playlist_size" type="number" min="1" max="5" step="1" />
        </div>
        <div>
          <label for="daily_hour">几点自动更新（北京时间）</label>
          <input id="daily_hour" type="number" min="0" max="23" step="1" />
        </div>
      </div>
      <label for="note">给自己的备注</label>
      <textarea id="note" placeholder="可选"></textarea>
      <div class="actions">
        <button type="button" class="primary" id="btn-save">保存设置</button>
        <button type="button" id="btn-reload">重新加载</button>
      </div>
      <p class="hint" style="margin-top:12px">保存要用下面的访问令牌。</p>
      <div class="msg" id="settings-msg"></div>
    </section>

    <section>
      <h2>马上换一批</h2>
      <p class="hint">按当前选书类型重新找书并推到主页，一般要几分钟。</p>
      <div class="actions">
        <button type="button" class="primary" id="btn-run">马上换一批</button>
        <a id="actions-link" href="#" target="_blank" rel="noopener">查看进度</a>
      </div>
      <div class="msg" id="run-msg"></div>
    </section>

    <section>
      <h2>访问令牌（只记在这台电脑）</h2>
      <label for="repo">仓库名</label>
      <input id="repo" type="text" placeholder="你的账号/tab5-grok-board" autocomplete="off" />
      <label for="token">GitHub 令牌</label>
      <input id="token" type="password" placeholder="粘贴后点记住" autocomplete="off" />
      <div class="actions">
        <button type="button" id="btn-token-save">记住</button>
        <button type="button" id="btn-token-clear">清除</button>
      </div>
      <p class="hint">令牌只存在本机浏览器。公用电脑不要填。</p>
      <div class="msg" id="token-msg"></div>
    </section>

    <section>
      <h2>设备拉取地址</h2>
      <p class="hint">Tab5 读的就是这个地址：</p>
      <p><code id="device-url">./weread_day.json</code></p>
    </section>
  </div>

  <script>
    const LS_TOKEN = "tab5_weread_gh_token";
    const LS_REPO = "tab5_weread_gh_repo";
    let siteConfig = { repo: "", workflow: "daily.yml" };
    let catalog = { categories: [], default_lanes: [], default_blacklist: [] };
    let pickIds = [];
    let banIds = [];
    let dragId = null;

    function $(id) { return document.getElementById(id); }
    function setMsg(id, text, ok) {
      const el = $(id);
      el.textContent = text || "";
      el.className = "msg " + (ok === true ? "ok" : ok === false ? "err" : "");
    }
    function byId(id) {
      return (catalog.categories || []).find((c) => c.id === id);
    }
    function currentRepo() {
      return ($("repo").value || siteConfig.repo || "").trim();
    }
    function pagesDayUrl() {
      const repo = currentRepo();
      if (!repo.includes("/")) return new URL("./weread_day.json", location.href).href;
      const [owner, name] = repo.split("/");
      return `https://${owner}.github.io/${name}/weread_day.json`;
    }
    function refreshDeviceUrl() {
      $("device-url").textContent = pagesDayUrl();
      const repo = currentRepo();
      $("actions-link").href = repo
        ? `https://github.com/${repo}/actions/workflows/${siteConfig.workflow || "daily.yml"}`
        : "#";
    }

    function chipEl(id, showRank, rank) {
      const cat = byId(id) || { id, label: id, hint: "" };
      const el = document.createElement("div");
      el.className = "chip";
      el.draggable = true;
      el.dataset.id = id;
      el.innerHTML = `
        <span class="handle" aria-hidden="true">⋮⋮</span>
        <div class="meta">
          <div class="name">${cat.label || id}</div>
          <div class="desc">${cat.hint || ""}</div>
        </div>
        ${showRank ? `<span class="rank">${rank}</span>` : ""}
      `;
      el.addEventListener("dragstart", (ev) => {
        dragId = id;
        el.classList.add("dragging");
        ev.dataTransfer.setData("text/plain", id);
        ev.dataTransfer.effectAllowed = "move";
      });
      el.addEventListener("dragend", () => {
        dragId = null;
        el.classList.remove("dragging");
        document.querySelectorAll(".board").forEach((b) => b.classList.remove("drop-hover"));
      });
      return el;
    }

    function renderLists() {
      const pick = $("pick-list");
      const ban = $("ban-list");
      pick.innerHTML = "";
      ban.innerHTML = "";
      if (!pickIds.length) {
        pick.innerHTML = `<div class="empty">把类型拖到这里</div>`;
      } else {
        pickIds.forEach((id, i) => pick.appendChild(chipEl(id, true, i + 1)));
      }
      if (!banIds.length) {
        ban.innerHTML = `<div class="empty">不会出现的类型</div>`;
      } else {
        banIds.forEach((id) => ban.appendChild(chipEl(id, false)));
      }
    }

    function moveToList(id, listName, beforeId) {
      pickIds = pickIds.filter((x) => x !== id);
      banIds = banIds.filter((x) => x !== id);
      if (listName === "pick") {
        if (beforeId && pickIds.includes(beforeId)) {
          pickIds.splice(pickIds.indexOf(beforeId), 0, id);
        } else {
          pickIds.push(id);
        }
      } else {
        if (beforeId && banIds.includes(beforeId)) {
          banIds.splice(banIds.indexOf(beforeId), 0, id);
        } else {
          banIds.push(id);
        }
      }
      renderLists();
    }

    function bindBoard(board) {
      board.addEventListener("dragover", (ev) => {
        ev.preventDefault();
        board.classList.add("drop-hover");
        ev.dataTransfer.dropEffect = "move";
      });
      board.addEventListener("dragleave", () => board.classList.remove("drop-hover"));
      board.addEventListener("drop", (ev) => {
        ev.preventDefault();
        board.classList.remove("drop-hover");
        const id = ev.dataTransfer.getData("text/plain") || dragId;
        if (!id) return;
        const chip = ev.target.closest(".chip");
        const beforeId = chip && chip.dataset.id !== id ? chip.dataset.id : null;
        moveToList(id, board.dataset.list, beforeId);
      });
    }

    function normalizeLists(settings) {
      const all = (catalog.categories || []).map((c) => c.id);
      const allSet = new Set(all);
      let lanes = Array.isArray(settings.lanes) ? settings.lanes.filter((id) => allSet.has(id)) : [];
      let bans = Array.isArray(settings.blacklist) ? settings.blacklist.filter((id) => allSet.has(id)) : [];
      if (!lanes.length && !bans.length) {
        lanes = (catalog.default_lanes || []).filter((id) => allSet.has(id));
        bans = (catalog.default_blacklist || []).filter((id) => allSet.has(id));
      }
      const used = new Set([...lanes, ...bans]);
      // 未出现在两边的类型默认进选书末尾
      all.forEach((id) => {
        if (!used.has(id)) lanes.push(id);
      });
      // 两边互斥
      bans = bans.filter((id) => !lanes.includes(id));
      pickIds = lanes;
      banIds = bans;
    }

    function fillSettings(s) {
      $("playlist_size").value = s.playlist_size ?? 5;
      $("daily_hour").value = s.daily_hour ?? 7;
      $("note").value = s.note || "";
      normalizeLists(s || {});
      renderLists();
    }
    function readSettingsForm() {
      return {
        playlist_size: Number($("playlist_size").value) || 5,
        daily_hour: Number($("daily_hour").value) || 7,
        timezone: "Asia/Shanghai",
        lanes: pickIds.slice(),
        blacklist: banIds.slice(),
        note: $("note").value || "",
      };
    }

    async function loadAll() {
      try {
        const [sRes, cRes, catRes] = await Promise.all([
          fetch(`./settings.json?t=${Date.now()}`, { cache: "no-store" }),
          fetch(`./site-config.json?t=${Date.now()}`, { cache: "no-store" }),
          fetch(`./categories.json?t=${Date.now()}`, { cache: "no-store" }),
        ]);
        if (catRes.ok) catalog = await catRes.json();
        if (cRes.ok) siteConfig = await cRes.json();
        if (sRes.ok) fillSettings(await sRes.json());
        else fillSettings({});
      } catch (_) {
        fillSettings({});
      }
      $("token").value = localStorage.getItem(LS_TOKEN) || "";
      $("repo").value = localStorage.getItem(LS_REPO) || siteConfig.repo || "";
      refreshDeviceUrl();
    }

    async function gh(path, method, body) {
      const token = $("token").value.trim();
      const repo = currentRepo();
      if (!token || !repo) throw new Error("请先填写仓库与令牌");
      const res = await fetch(`https://api.github.com/repos/${repo}${path}`, {
        method,
        headers: {
          Accept: "application/vnd.github+json",
          Authorization: `Bearer ${token}`,
          "X-GitHub-Api-Version": "2022-11-28",
          "Content-Type": "application/json",
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { message: text }; }
      if (!res.ok) throw new Error((data && data.message) || `HTTP ${res.status}`);
      return data;
    }
    async function putFile(path, contentObj, message) {
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(contentObj, null, 2) + "\n")));
      let sha;
      try {
        const cur = await gh(`/contents/${path}`, "GET");
        sha = cur.sha;
      } catch (_) { /* new */ }
      return gh(`/contents/${path}`, "PUT", { message, content, sha, branch: "main" });
    }

    bindBoard($("pick-board"));
    bindBoard($("ban-board"));
    $("btn-reload").addEventListener("click", () => loadAll());
    $("btn-token-save").addEventListener("click", () => {
      localStorage.setItem(LS_TOKEN, $("token").value.trim());
      localStorage.setItem(LS_REPO, $("repo").value.trim());
      refreshDeviceUrl();
      setMsg("token-msg", "已记住。", true);
    });
    $("btn-token-clear").addEventListener("click", () => {
      localStorage.removeItem(LS_TOKEN);
      localStorage.removeItem(LS_REPO);
      $("token").value = "";
      setMsg("token-msg", "已清除。", true);
    });
    $("repo").addEventListener("input", refreshDeviceUrl);
    $("btn-save").addEventListener("click", async () => {
      setMsg("settings-msg", "保存中…");
      try {
        if (!pickIds.length) throw new Error("选书类型不能为空");
        await putFile("docs/settings.json", readSettingsForm(), "chore: update weread type prefs");
        setMsg("settings-msg", "设置已保存。", true);
      } catch (e) {
        setMsg("settings-msg", String(e.message || e), false);
      }
    });
    $("btn-run").addEventListener("click", async () => {
      setMsg("run-msg", "触发中…");
      try {
        const wf = siteConfig.workflow || "daily.yml";
        await gh(`/actions/workflows/${wf}/dispatches`, "POST", {
          ref: "main",
          inputs: { reason: "settings-page" },
        });
        setMsg("run-msg", "已开始换一批，过几分钟刷新预览看看。", true);
      } catch (e) {
        setMsg("run-msg", String(e.message || e), false);
      }
    });

    loadAll();
  </script>
</body>
</html>
